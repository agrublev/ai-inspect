[package]
# crates.io package name — "iris" itself is a reserved name there.
# The installed binary stays `iris` (see [[bin]] below).
name = "iris-tui"
version = "0.2.0"
edition = "2021"
description = "Local-first Claude Code session supervisor and AI trace explorer"
license = "MIT"
repository = "https://github.com/itzenata/iris-tui"
homepage = "https://itzenata.github.io/iris-tui/"
readme = "README.md"
keywords = ["claude", "tui", "terminal", "dashboard", "monitoring"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published package lean: site, screenshots, and GitHub meta stay in the repo only.
exclude = ["docs/", ".github/", "CONTRIBUTING.md", "CLAUDE.md"]

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
chrono = "0.4"
dirs = "5"
ureq = "2"
tiny_http = "0.12"

[dev-dependencies]
# Test-only: auto-cleaning temp dirs so tests never touch ~/.claude/iris.
# Not compiled into the release binary.
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
